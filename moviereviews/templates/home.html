
{% extends 'base.html' %}
{% block content %}


<div class="container">
    <form action>
        <div class="mb-3">
            <label for="searchMovie" class="form-label">
                Search for a movie:
            </label>
            <input type="text" class="form-control" id="searchMovie" name="searchMovie">
        </div>
        <button type="submit" class="btn btn-primary">
            Search
        </button>
    </form>

    <p>Searching for: {{searchTerm}}</p>

    <div class="row row-cols-1 row-cols-md-3 g-4"> 
        {% for movie in movies %}
        <div v-for="movie in movies" class="col">
            <div class="card">
                <img src="{{ movie.image.url }}" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">{{ movie.title }}</h5>
                    <p class="card-text">{{ movie.description }}</p>
                    {% if movie.url %}
                        <a href="{{ movie.url }}" class="btn btn-primary">Movie Link</a>
                    {% endif %}
                    <p class="card-text"><small class="text-muted">{{ movie.genre }}</small></p>
                    <p class="card-text"><small class="text-muted">{{ movie.year }}</small></p>
                </div>
            </div>
        </div>
    {% endfor %}
    </div>

    <br/>
    <br/>
    <br/>
    <h2>Join our mailing list</h2>
    <form action={% url 'signup' %}>
        <div class="mb-3">
            <label for="email" class="form-label">
                Email address:
            </label>
        </div>
            <input type="email" class="form-control" id="email" name="email">
        <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
</div>

{% endblock content %}
